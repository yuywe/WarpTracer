[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "warptracer"
version = "0.2.0"
description = "GPU racing simulator: batched bicycle-model cars, LiDAR, disparity control and PPO on Warp"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "warp-lang==1.17.0",
    "pyglet>=2.0,<3",
    "imageio>=2.34",
    "imageio-ffmpeg>=0.5",
    "pillow>=10",
    "scikit-image>=0.24",
    "torch==2.8.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
warptracer = "warptracer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# PyPI's default torch wheel is CUDA-enabled on Linux but CPU-only on Windows.
# Route Windows at PyTorch's own CUDA 12.8 wheel index instead; Linux/macOS keep PyPI.
[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

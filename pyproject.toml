[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "warptracer"
version = "0.2.0"
description = "Minimal 3D track and rigid-body vehicle playground"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "newton==1.6.0",
    "numpy>=1.24",
    "warp-lang==1.17.0",
]

[project.optional-dependencies]
viz = ["viser==1.0.26"]
dev = ["pytest>=8"]

[project.scripts]
warptracer-demo = "warptracer.demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
